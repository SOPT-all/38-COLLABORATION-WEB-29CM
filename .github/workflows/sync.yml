name: Sync to personal repo

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to personal repo
        run: |
          git push https://x-access-token:${{ secrets.PERSONAL_REPO_PAT }}@github.com/pwc2002/38-COLLABORATION-WEB-29CM-CLONE.git ${{ github.ref_name }} --force